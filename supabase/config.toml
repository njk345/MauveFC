project_id = "mauve-fc"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
[auth.email.template.magic_link]
subject = "Your Mauve FC sign-in code"
content_path = "./templates/sign-in.html"
[functions.leagueapps-sync]
# pg_net jobs authenticate with private, short-lived, single-use capabilities.
verify_jwt = false
